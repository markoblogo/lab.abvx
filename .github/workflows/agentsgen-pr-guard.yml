name: agentsgen contract guard

on:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS docs guard
        uses: markoblogo/AGENTS.md_generator/.github/actions/agentsgen-guard@main
        with:
          path: "."
          files: "AGENTS.md\nRUNBOOK.md\n"
          pack_check: "true"
          comment: "false"
          show_commands: "true"
