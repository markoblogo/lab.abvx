name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile snapshot tools
        run: python3 -m compileall -q scripts
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify static site
        run: python3 scripts/verify_site.py
